name: Visual Regression (PADCON)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  visual-regression:
    name: Blur / backdrop-filter guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build (production)
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat preview.log
          exit 1

      - name: Run PADCON regression (single-page smoke)
        env:
          PARXIS_URL: http://127.0.0.1:8080
        run: node tests/visual-regression-padcon.mjs

      - name: Run full suite (routes × PT/EN × contrast × 7 viewports)
        env:
          PARXIS_URL: http://127.0.0.1:8080
        run: node tests/visual-regression-suite.mjs

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

      - name: Upload preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-log
          path: preview.log
          if-no-files-found: ignore